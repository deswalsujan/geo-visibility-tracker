# Runs geo_check.py once a day and on manual trigger, then commits the
# updated results.csv back to the repo. The Gemini key comes from a
# GitHub Actions secret, never from a file in this repo.

name: geo_check

on:
  schedule:
    - cron: "10 22 * * *" # Fires 22:10 UTC to land ~09:00 AM IST; compensates for this repo's ~5h20m schedule-trigger delay, observed 9/15-9/17, see LOG.md
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Run geo_check.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: uv run geo_check.py --trigger-type "$TRIGGER_TYPE"

      - name: Commit results.csv if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.csv
          if ! git diff --cached --quiet -- results.csv; then
            git commit -m "geo_check: daily results $(date -u +%Y-%m-%d)"
            git push
          fi
